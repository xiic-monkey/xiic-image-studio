[package]
name = "xiic-image-studio"
version = "0.1.0"
description = "Local-first AI image generation studio"
authors = ["xiic"]
edition = "2021"

[lib]
name = "xiic_image_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
image = "0.25"
reqwest = { version = "0.12", features = ["json", "stream", "multipart"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["sync", "time", "fs", "process", "macros", "rt-multi-thread"] }
uuid = { version = "1", features = ["v4", "serde"] }
# 无头 MCP 模式（--mcp）自己定位应用数据目录
dirs = "5"
# API key 加密存储（AES-256-GCM + 机器绑定密钥派生）
aes-gcm = "0.10"
sha2 = "0.10"

[profile.release]
strip = true
lto = true

# ---- 开发构建体积优化 ----
# 依据 Cargo 官方指南 Optimizing Build Performance：
# 自身 crate 保留行号表，panic backtrace 仍可定位到 文件:行号
# 第三方依赖不生成任何调试信息（依赖通常占 target 体积的 80% 以上）
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# 需要完整调试依赖内部时：cargo build --profile debugging
[profile.debugging]
inherits = "dev"
debug = true
