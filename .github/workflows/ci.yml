name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    # 窗口上屏的 objc 代码只在 macOS 编译；用 macOS runner 省掉 Linux 侧
    # webkit2gtk / gtk 的系统依赖安装，和主要开发平台保持一致。
    runs-on: macos-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Fetch ffmpeg sidecar
        # Tauri 构建脚本要求 externalBin 指向的文件存在，而 ffmpeg 按设计不在 git 里
        # （43MB 平台专属二进制），只能从 GitHub Release 拉。干净 checkout 下不拉，
        # cargo 任何命令都会在 build script 阶段挂掉。
        # working-directory 覆盖成仓库根：脚本按仓库根的相对路径写 src-tauri/binaries。
        working-directory: .
        run: ./scripts/fetch-ffmpeg.sh
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test --lib
      - name: Examples
        run: cargo check --examples

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run build
